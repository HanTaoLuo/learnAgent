[project]
name = "llm-gateway"
version = "0.1.0"
description = "A FastAPI gateway with pluggable LLM provider adapters"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.23.0",
    "openai>=2.0.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
