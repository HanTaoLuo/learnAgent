[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-harness"
version = "0.1.0"
description = "Guarded tool execution and run-state management for smolagents"
requires-python = ">=3.10"
dependencies = ["smolagents==1.26.0", "requests>=2.32.3", "python-dotenv"]

[project.optional-dependencies]
test = ["pytest>=7.4.4"]

[project.scripts]
guarded-harness = "guarded_harness.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "-vv -ra --tb=long --durations=10 --color=no -p no:cacheprovider"
enable_assertion_pass_hook = true
